<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VST Runner - Web Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h2 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 8px;
        }

        .status {
            background: #f7fafc;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .status-item:last-child {
            border-bottom: none;
        }

        .status-label {
            font-weight: 600;
            color: #4a5568;
        }

        .status-value {
            color: #2d3748;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-indicator.active {
            background: #48bb78;
        }

        .status-indicator.inactive {
            background: #f56565;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
        }

        .input-group input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .input-group input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-group input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #e2e8f0;
            outline: none;
            -webkit-appearance: none;
        }

        .input-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        .input-group input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
        }

        .slider-value {
            text-align: right;
            color: #667eea;
            font-weight: 600;
            margin-top: 5px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 120px;
        }

        button.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        button.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button.secondary {
            background: #f7fafc;
            color: #4a5568;
            border: 2px solid #e2e8f0;
        }

        button.secondary:hover {
            background: #e2e8f0;
        }

        button.danger {
            background: #f56565;
            color: white;
        }

        button.danger:hover {
            background: #e53e3e;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .toggle {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f7fafc;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .toggle label {
            flex: 1;
            font-weight: 600;
            color: #4a5568;
            cursor: pointer;
        }

        .toggle input[type="checkbox"] {
            width: 50px;
            height: 26px;
            position: relative;
            -webkit-appearance: none;
            background: #cbd5e0;
            outline: none;
            border-radius: 13px;
            cursor: pointer;
            transition: 0.3s;
        }

        .toggle input[type="checkbox"]:checked {
            background: #667eea;
        }

        .toggle input[type="checkbox"]:before {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            background: white;
            transition: 0.3s;
        }

        .toggle input[type="checkbox"]:checked:before {
            left: 26px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }

        .alert.success {
            background: #c6f6d5;
            color: #22543d;
            border-left: 4px solid #48bb78;
        }

        .alert.error {
            background: #fed7d7;
            color: #742a2a;
            border-left: 4px solid #f56565;
        }

        .alert.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #718096;
            font-size: 12px;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 VST Runner</h1>
            <p>Web Interface - Control your VST plugins from anywhere</p>
        </div>

        <div class="content">
            <div id="alert" class="alert"></div>

            <!-- Status Section -->
            <div class="section">
                <h2>Status</h2>
                <div class="status">
                    <div class="status-item">
                        <span class="status-label">
                            <span id="serverStatus" class="status-indicator"></span>
                            Server Status
                        </span>
                        <span class="status-value" id="serverStatusText">Connecting...</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Plugin Loaded</span>
                        <span class="status-value" id="pluginName">None</span>
                    </div>
                </div>
            </div>

            <!-- Plugin Loading Section -->
            <div class="section">
                <h2>Load Plugin</h2>
                <div class="input-group">
                    <label for="pluginPath">Plugin Path</label>
                    <input type="text" id="pluginPath" placeholder="Enter full path to plugin file (e.g., C:\Path\To\Plugin.dll)">
                </div>
                <div class="button-group">
                    <button class="primary" onclick="loadPlugin()">Load Plugin</button>
                    <button class="danger" onclick="unloadPlugin()">Unload Plugin</button>
                </div>
            </div>

            <!-- Audio Controls Section -->
            <div class="section">
                <h2>Audio Controls</h2>

                <div class="input-group">
                    <label for="inputGain">Input Gain</label>
                    <input type="range" id="inputGain" min="0" max="2" step="0.01" value="1" oninput="updateInputGain(this.value)">
                    <div class="slider-value"><span id="inputGainValue">1.00</span>x</div>
                </div>

                <div class="input-group">
                    <label for="outputGain">Output Gain</label>
                    <input type="range" id="outputGain" min="0" max="2" step="0.01" value="1" oninput="updateOutputGain(this.value)">
                    <div class="slider-value"><span id="outputGainValue">1.00</span>x</div>
                </div>

                <div class="toggle">
                    <label for="audioInput">Audio Input Enabled</label>
                    <input type="checkbox" id="audioInput" checked onchange="updateAudioInput(this.checked)">
                </div>

                <div class="toggle">
                    <label for="midiInput">MIDI Input Enabled</label>
                    <input type="checkbox" id="midiInput" checked onchange="updateMidiInput(this.checked)">
                </div>
            </div>
        </div>

        <div class="footer">
            VST Runner Web Interface | Built with JUCE | <span id="serverUrl"></span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
