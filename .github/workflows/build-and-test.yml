name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  BUILD_TYPE: Release

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasound2-dev \
          libjack-jackd2-dev \
          libfreetype6-dev \
          libx11-dev \
          libxext-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxcomposite-dev \
          mesa-common-dev \
          freeglut3-dev \
          libcurl4-openssl-dev \
          pkg-config \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          cmake \
          build-essential

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DBUILD_TESTS=ON

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Run Tests
      working-directory: ${{github.workspace}}/build
      run: ./VSTRunnerTests_artefacts/${{env.BUILD_TYPE}}/VSTRunnerTests

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vst-runner-linux
        path: |
          ${{github.workspace}}/build/VSTRunner_artefacts/${{env.BUILD_TYPE}}/VSTRunner

  build-macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DBUILD_TESTS=ON

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Run Tests
      working-directory: ${{github.workspace}}/build
      run: ./VSTRunnerTests_artefacts/${{env.BUILD_TYPE}}/VSTRunnerTests

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vst-runner-macos
        path: |
          ${{github.workspace}}/build/VSTRunner_artefacts/${{env.BUILD_TYPE}}/VSTRunner.app

  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DBUILD_TESTS=ON

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Run Tests
      working-directory: ${{github.workspace}}/build
      run: .\VSTRunnerTests_artefacts\${{env.BUILD_TYPE}}\VSTRunnerTests.exe

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vst-runner-windows
        path: |
          ${{github.workspace}}/build/VSTRunner_artefacts/${{env.BUILD_TYPE}}/VSTRunner.exe

  code-format-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install clang-format
      run: sudo apt-get install -y clang-format

    - name: Check formatting
      run: |
        find Source -name '*.cpp' -o -name '*.h' | xargs clang-format -n -Werror
